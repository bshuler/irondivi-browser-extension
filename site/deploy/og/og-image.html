<!DOCTYPE html>
<!-- The link preview for browser.irondivi.com (Open Graph / Twitter card), 1200x630.
     Rendered to site/assets/og-image-v2.png (a new name per redesign: link previews are cached by URL; og-image.png is the old one) by site/deploy/og/render.mjs; not served itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../fonts/inter-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Inter", sans-serif; color: #f8fafc; overflow: hidden;
    background:
      radial-gradient(900px 500px at 100% 0%, rgba(233, 69, 96, 0.22), transparent 60%),
      radial-gradient(700px 500px at 0% 100%, rgba(99, 102, 241, 0.20), transparent 60%),
      #0f0f1a;
    padding: 64px 72px; display: flex; flex-direction: column;
  }
  /* Both marks: the wallet's indigo shield and the IronDivi wordmark with its iron shield */
  .brand { display: flex; align-items: center; gap: 24px; }
  .brand .wallet { width: 96px; height: 96px; filter: drop-shadow(0 0 24px rgba(99, 102, 241, 0.4)); }
  .brand .word { height: 64px; width: auto; }
  .brand span { font-size: 44px; font-weight: 600; color: #cbd5e1; letter-spacing: -0.01em; }
  h1 { margin-top: 36px; font-size: 64px; line-height: 1.06; font-weight: 800; letter-spacing: -0.03em; max-width: 960px; }
  h1 em { font-style: normal; color: #f7889b; }
  .browsers { margin-top: auto; display: flex; gap: 18px; }
  .b {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 20px 0 16px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .b img { width: 64px; height: 64px; }
  .b span { font-size: 22px; font-weight: 700; color: #f8fafc; }
  .foot { margin-top: 26px; display: flex; justify-content: space-between; font-size: 22px; color: #94a3b8; }
  .foot strong { color: #f8fafc; font-weight: 700; }
</style>
</head>
<body>
  <div class="brand"><img class="wallet" src="../../assets/brand/irondivi-wallet-mark.svg" alt=""><img class="word" src="../../assets/brand/irondivi-wordmark.svg" alt="IronDivi"><span>Wallet</span></div>
  <h1>The Divi wallet for <em>every desktop browser</em></h1>
  <div class="browsers">
    <div class="b"><img src="../../assets/browsers/chrome.svg" alt=""><span>Chrome</span></div>
    <div class="b"><img src="../../assets/browsers/brave.svg" alt=""><span>Brave</span></div>
    <div class="b"><img src="../../assets/browsers/edge.svg" alt=""><span>Edge</span></div>
    <div class="b"><img src="../../assets/browsers/opera.svg" alt=""><span>Opera</span></div>
    <div class="b"><img src="../../assets/browsers/firefox.svg" alt=""><span>Firefox</span></div>
    <div class="b"><img src="../../assets/browsers/safari.svg" alt=""><span>Safari</span></div>
  </div>
  <div class="foot"><span><strong>browser.irondivi.com</strong></span><span>Windows · macOS · Linux · Open source · Beta</span></div>
</body>
</html>
