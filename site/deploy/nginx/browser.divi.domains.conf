# browser.divi.domains: the static page for the IronDivi Wallet browser extension, plus the
# packages it offers in /downloads/. TLS is added by certbot (certbot --nginx -d browser.divi.domains),
# which rewrites the listen lines; site/deploy/deploy.sh re-runs `certbot install` after each copy of this file.

# A package is saved, not opened; an empty value sends no header. A map, not an `if`, because
# add_header inside an `if` would replace every other header of the location.
map $uri $browser_divi_disposition {
    ~\.(zip|xpi)$ attachment;
    default        "";
}

server {
    server_name browser.divi.domains;

    root /var/www/browser.divi.domains;
    index index.html;

    access_log /var/log/nginx/browser.divi.domains.access.log;
    error_log  /var/log/nginx/browser.divi.domains.error.log;

    include snippets/divi-hsts.conf;
    include snippets/divi-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    include snippets/deny-dotfiles.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # add_header in a location drops the server-level headers, so each location below repeats
    # all of them (see divi-security-headers.conf).

    # The page reads this to offer each browser its package; it changes with every release.
    location = /downloads/releases.json {
        include snippets/divi-hsts.conf;
        include snippets/divi-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Packages and checksum files. Every version stays, so the listing is the release history.
    # attachment makes the browser save a package instead of trying to install or open it.
    location ^~ /downloads/ {
        include snippets/divi-hsts.conf;
        include snippets/divi-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        autoindex on;
        add_header Content-Disposition $browser_divi_disposition always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
