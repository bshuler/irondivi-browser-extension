# browser.divi.domains: the extension's old address. Every page and package moved to
# browser.irondivi.com, so links already shared (and the v0.0.6-and-older wallets' Allowed
# Sites entry) land on the same path there. TLS is added by certbot, as for the site itself.

server {
    server_name browser.divi.domains;

    access_log /var/log/nginx/browser.divi.domains.access.log;
    error_log  /var/log/nginx/browser.divi.domains.error.log;

    include snippets/divi-hsts.conf;
    include snippets/divi-security-headers.conf;

    location / {
        return 301 https://browser.irondivi.com$request_uri;
    }
}
